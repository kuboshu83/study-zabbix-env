services:
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.4-latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_SERVER_HOST=zabbix-database
      - DB_SERVER_PORT=${POSTGRES_PORT}
    depends_on:
      - zabbix-database
    networks:
      - zabbix-nw

  zabbix-database:
    image: postgres:18.1
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - zabbix-nw

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=zabbix-database
      - DB_SERVER_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - zabbix-server
    ports:
      - 8080:8080
    networks:
      - zabbix-nw

networks:
  zabbix-nw: