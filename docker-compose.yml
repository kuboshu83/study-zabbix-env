services:
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.4-latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_SERVER_HOST=zabbix-database
      - DB_SERVER_PORT=${POSTGRES_PORT}
    volumes:
      - ${PWD}/data/zabbix-server/var/lib/zabbix/export:/var/lib/zabbix/export
      - ${PWD}/data/zabbix-server/var/lib/zabbix/snmptraps:/var/lib/zabbix/snmptraps
    depends_on:
      zabbix-database:
        condition: service_healthy
    networks:
      - zabbix-nw

  zabbix-database:
    image: postgres:18.1
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    volumes:
      - ${PWD}/data/zabbix-database/var/lib/postgresql:/var/lib/postgresql
    networks:
      - zabbix-nw

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=zabbix-database
      - DB_SERVER_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      zabbix-server:
        condition: service_started
    ports:
      - 8080:8080
    networks:
      - zabbix-nw

  zabbix-server-agent:
    image: zabbix/zabbix-agent:ubuntu-7.4-latest
    environment:
      - ZBX_HOSTNAME=zabbix-server
      - ZBX_SERVER_HOST=zabbix-server
    networks:
      - zabbix-nw

  zabbix-target:
    build: 
      context: ./ubuntu-target
      dockerfile: Dockerfile
    image: localhost/zabbix-target-ubuntu:24.04
    expose:
      - "10050"
    tty: true
    networks:
      - zabbix-nw

networks:
  zabbix-nw: